name: Desktop packages

# Independent, opt-in builds. No upload to an update feed or public release.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: '--mac --arm64'
            artifact: mac-arm64
          - os: macos-15-intel
            target: '--mac --x64'
            artifact: mac-x64
          - os: windows-latest
            target: '--win --x64'
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm --prefix desktop run lint
      - run: npm --prefix desktop test
      - run: npm --prefix desktop run test:smoke
      - name: Build unsigned test installers
        run: npm --prefix desktop run dist -- ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: bunvelope-${{ matrix.artifact }}-unsigned
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ matrix.artifact }}
          path: desktop/artifacts/
          if-no-files-found: ignore
